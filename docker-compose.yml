services:
  db:
    image: postgres:14                # ganti ke 14 jika memang perlu
    environment:
      POSTGRES_DB: iatta_db
      POSTGRES_USER: rizkyajiekurniawan
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"                   # <- host 5433 to container 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    environment:
      - DATABASE_URL=postgresql://rizkyajiekurniawan:postgres@db:5432/iatta_db
      - PORT=4000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy    # gunakan healthcheck supaya server ngga buru-buru

  client:
    build: ./client
    environment:
      - NITRO_HOST=0.0.0.0
      - PORT=3000
      - API_BASE_URL=http://server:4000/api
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  db-data: